services:
  hri:
    build:
      context: .
      dockerfile: Dockerfile
    image: candidates-hri:jazzy-cuda
    container_name: hri_dev
    stdin_open: true
    tty: true
    network_mode: host
    volumes:
      - ./ros2_ws:/ros2_ws
      - ./data:/data
      # El host usa PipeWire, que expone un socket compatible con PulseAudio. Se monta
      # ese socket en lugar de pasar /dev/snd: el acceso directo al hardware ALSA
      # competiria con PipeWire, que ya tiene el dispositivo tomado.
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:/tmp/pulse-native
    environment:
      - PULSE_SERVER=unix:/tmp/pulse-native
    devices:
      - /dev/video0:/dev/video0
    security_opt:
      - label=disable
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
