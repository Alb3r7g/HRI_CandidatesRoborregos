services:
  hri:
    build:
      context: .
      dockerfile: Dockerfile
    image: candidates-hri:jazzy-cuda
    container_name: hri_dev
    stdin_open: true
    tty: true
    network_mode: host
    volumes:
      - ./ros2_ws:/ros2_ws
      - ./data:/data
      # El host usa PipeWire, que expone un socket compatible con PulseAudio. Se monta
      # ese socket en lugar de pasar /dev/snd: el acceso directo al hardware ALSA
      # competiria con PipeWire, que ya tiene el dispositivo tomado.
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:/tmp/pulse-native
    environment:
      - PULSE_SERVER=unix:/tmp/pulse-native
    devices:
      # Ruta por id del hardware en vez de /dev/video0: el kernel renumera los
      # nodos cuando la webcam USB se reconecta, y el nodo mapeado al crear el
      # contenedor queda apuntando a un dispositivo inexistente.
      - /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._USB2.0_HD_UVC_WebCam-video-index0:/dev/video0
    security_opt:
      - label=disable
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
